[project]
name = "atlas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Phani-stack", email = "kdlphani916@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "PyJWT>=2.10.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
tutor = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.14.2",
    "trafilatura>=2.0.0",
    "youtube-transcript-api>=1.2.1",
]

[project.scripts]
atlas = "atlas.api.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
